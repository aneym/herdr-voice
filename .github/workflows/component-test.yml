name: component-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  component:
    # The audio layer is written for two platforms and the tests for it are
    # pure, so they cost seconds on both. Running them only on Linux would leave
    # the macOS half — which is the half most people use — unverified by
    # anything except the maintainer's own machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-fund --no-audit
      # No audio hardware, no microphone permission, no API key: these tests
      # cover the parts that decide which device is used and how the player is
      # invoked, which is where silent failures live.
      - run: npm run test:component
