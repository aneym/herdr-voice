id = "herdr-voice"
name = "Voice"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Voice control for herdr via the OpenAI Realtime API — speak to create spaces, split panes, apply layouts, and start/prompt agents. Compact HUD with live dictation, clickable toggles, and persisted transcripts."
platforms = ["macos"]

# Install the single runtime dependency (ws). Runs once at plugin install,
# after the user confirms the trust preview.
[[build]]
command = ["npm", "install", "--omit=dev", "--no-fund", "--no-audit"]

# Native HUD pane inside herdr (non-modal — you keep working in other panes).
# It renders events from a running voice engine over ~/.cache/herdr-voice/ctl.sock:
# either a local engine (src/engine.js) or one on another machine reverse-tunneled
# here (see bin/herdr-voice-engine). If no engine is up it waits and says so.
[[panes]]
id = "hud"
title = "voice"
placement = "split"
command = ["node", "src/ui.js"]

# All-in-one popup (engine + UI in one process on this host). Modal while open;
# useful on a single machine with a real microphone, or for text-only control.
[[panes]]
id = "voice-popup"
title = "voice"
placement = "popup"
width = "60%"
height = "55%"
command = ["node", "src/index.js"]

# Remote topology: when the herdr server is on one machine and you sit at
# another, summon the HUD on the machine with the microphone. Set
# HERDR_VOICE_HANDS_HOST (ssh host of the machine you sit at) — see README.
[[actions]]
id = "summon"
title = "Summon voice HUD on your local machine"
command = ["zsh", "bin/herdr-voice-summon"]
